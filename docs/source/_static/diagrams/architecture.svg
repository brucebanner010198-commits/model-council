<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Inter','Segoe UI',sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box{fill:#0a0a0c;stroke:#27272a;stroke-width:1.5;rx:12;ry:12}
      .box-brand{fill:#0f766e14;stroke:#0f766e}
      .box-brand-2{fill:#34d39914;stroke:#34d399}
      .lbl{fill:#e4e4e7;font-weight:600}
      .sub{fill:#a1a1aa;font-size:11px}
      .flow{stroke:#94a3b8;stroke-width:1.5;fill:none}
      .flow-strong{stroke:#34d399;stroke-width:2;fill:none}
      .tag{fill:#a1a1aa;font-size:11px;font-family:'JetBrains Mono',monospace}
    </style>
  </defs>
  <rect width="900" height="520" fill="#050505"/>
  <text x="450" y="32" text-anchor="middle" fill="#e4e4e7" font-size="16" font-weight="600">The Council — High-level architecture</text>

  <!-- Browser -->
  <rect class="box box-brand" x="40" y="70" width="200" height="90"/>
  <text class="lbl" x="140" y="100" text-anchor="middle">Browser (React SPA)</text>
  <text class="sub" x="140" y="120" text-anchor="middle">React 19 · Tailwind · shadcn/ui</text>
  <text class="tag" x="140" y="140" text-anchor="middle">REACT_APP_BACKEND_URL</text>

  <!-- Ingress -->
  <rect class="box" x="310" y="70" width="180" height="90"/>
  <text class="lbl" x="400" y="100" text-anchor="middle">Kubernetes ingress</text>
  <text class="tag" x="400" y="120" text-anchor="middle">/api/*  → :8001</text>
  <text class="tag" x="400" y="138" text-anchor="middle">/*      → :3000</text>

  <!-- Backend -->
  <rect class="box box-brand-2" x="560" y="70" width="300" height="90"/>
  <text class="lbl" x="710" y="100" text-anchor="middle">FastAPI backend (:8001)</text>
  <text class="sub" x="710" y="120" text-anchor="middle">auth · routing · voice · PDF</text>
  <text class="tag" x="710" y="138" text-anchor="middle">server.py · APIRouter(prefix="/api")</text>

  <!-- Down layer boxes -->
  <rect class="box" x="560" y="210" width="140" height="78"/>
  <text class="lbl" x="630" y="236" text-anchor="middle">MongoDB</text>
  <text class="sub" x="630" y="256" text-anchor="middle">motor (async)</text>
  <text class="tag" x="630" y="274" text-anchor="middle">users · sessions · …</text>

  <rect class="box" x="720" y="210" width="140" height="78"/>
  <text class="lbl" x="790" y="236" text-anchor="middle">LLM providers</text>
  <text class="sub" x="790" y="256" text-anchor="middle">OpenAI · Anthropic · …</text>
  <text class="tag" x="790" y="274" text-anchor="middle">+ OpenRouter fallback</text>

  <rect class="box" x="560" y="330" width="140" height="78"/>
  <text class="lbl" x="630" y="356" text-anchor="middle">Voice</text>
  <text class="sub" x="630" y="376" text-anchor="middle">TTS + Whisper</text>
  <text class="tag" x="630" y="394" text-anchor="middle">emergentintegrations</text>

  <rect class="box" x="720" y="330" width="140" height="78"/>
  <text class="lbl" x="790" y="356" text-anchor="middle">Email</text>
  <text class="sub" x="790" y="376" text-anchor="middle">Magic-link sign-in</text>
  <text class="tag" x="790" y="394" text-anchor="middle">Resend</text>

  <!-- Arrows: Browser → Ingress → Backend -->
  <path class="flow-strong" d="M240 115 L310 115" marker-end="url(#arrow)"/>
  <path class="flow-strong" d="M490 115 L560 115" marker-end="url(#arrow)"/>
  <text class="tag" x="275" y="105" text-anchor="middle">/api/…</text>
  <text class="tag" x="525" y="105" text-anchor="middle">HTTP</text>

  <!-- Backend to services -->
  <path class="flow" d="M660 160 L630 210" marker-end="url(#arrow)"/>
  <path class="flow" d="M740 160 L790 210" marker-end="url(#arrow)"/>
  <path class="flow" d="M660 288 L630 330" marker-end="url(#arrow)"/>
  <path class="flow" d="M740 288 L790 330" marker-end="url(#arrow)"/>

  <!-- Note block -->
  <rect class="box" x="40" y="210" width="440" height="198"/>
  <text class="lbl" x="60" y="235">Per-request user context</text>
  <text class="sub" x="60" y="258">get_current_user reads the session cookie / Bearer token,</text>
  <text class="sub" x="60" y="274">verifies expiry in user_sessions, and stores user_id in a</text>
  <text class="sub" x="60" y="290">ContextVar. Settings helpers read that ContextVar to resolve</text>
  <text class="sub" x="60" y="306">the caller’s per-user API keys — no thread-locals, no globals.</text>

  <text class="lbl" x="60" y="340">Model routing (per member)</text>
  <text class="sub" x="60" y="362">• auto        → native provider if key present, else OpenRouter</text>
  <text class="sub" x="60" y="378">• direct      → native first, OpenRouter on error</text>
  <text class="sub" x="60" y="394">• openrouter  → OpenRouter only</text>

  <text class="tag" x="450" y="500" text-anchor="end">See docs → developer/architecture</text>
</svg>
